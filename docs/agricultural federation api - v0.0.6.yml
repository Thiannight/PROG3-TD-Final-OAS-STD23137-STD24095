openapi: 3.1.0
info:
  title: Agricultural federation API
  description: |
    # Versioning
    This API uses semantic versioning (MAJOR.MINOR.PATCH). Available versions are :
    - v0.0.1 (2026-04-21) : POST /collectivities and POST /members.
    - v0.0.2 (2026-04-22) : PUT /collectivities/{id}/informations.
    - v0.0.3 (2026-04-23) : Membership fees, transactions, financial accounts, member payments.
    - v0.0.4 (2026-04-23) : GET /collectivities/{id} and GET /collectivities/{id}/financialAccounts.
    - v0.0.5 (2026-05-05) : Collectivity and federation statistics.
    - v0.0.6 (2026-05-07) : Feature E — Activities (POST/GET /collectivities/{id}/activities).
                             Feature F — Attendance (POST/GET /activities/{id}/attendances,
                             GET /members/{id}/attendances).
  version: 0.0.6
servers:
  - url: 'https://localhost:8080'

paths:

  # ── Existing paths (unchanged) ────────────────────────────────────────────

  '/collectivities':
    post:
      summary: Create list of collectivities
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateCollectivity'
      responses:
        201:
          description: List of created collectivities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collectivity'
        400:
          description: Collectivity without federation approval or structure missing.
        404:
          description: Member not found.

  '/collectivities/{id}':
    get:
      summary: Retrieve collectivity by its ID.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: Collectivity retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        404:
          description: Collectivity not found

  '/collectivities/{id}/financialAccounts':
    get:
      summary: Get collectivity financial accounts
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: at
          schema:
            type: string
            format: date
      responses:
        200:
          description: List of financial accounts of the collectivity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FinancialAccount'
        404:
          description: Collectivity not found

  '/collectivities/{id}/informations':
    put:
      summary: Attribute collectivity informations to specific collectivity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectivityInformation'
      responses:
        200:
          description: Collectivity with updated information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collectivity'
        400:
          description: Either given number or name is already used by other collectivity.
        404:
          description: Collectivity not found.

  '/collectivities/{id}/membershipFees':
    get:
      summary: Retrieve collectivity membership fees
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: List of membership fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'
        404:
          description: Collectivity not found.
    post:
      summary: Create new membership fees for a specific collectivity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMembershipFee'
      responses:
        200:
          description: Created membership fees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MembershipFee'
        400:
          description: Either unrecognized frequency or amount under 0.
        404:
          description: Collectivity not found.

  '/collectivities/{id}/transactions':
    get:
      summary: Retrieve collectivity transactions for a given period
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: true
      responses:
        200:
          description: List of collectivity transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityTransaction'
        400:
          description: Invalid query parameters.
        404:
          description: Collectivity not found.

  # ── Feature E : Activities ─────────────────────────────────────────────────

  '/collectivities/{id}/activities':
    get:
      summary: List all activities of a collectivity
      description: |
        Returns all activities (mandatory and exceptional) scheduled for the collectivity,
        ordered by scheduledDate ascending.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: List of activities for the collectivity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        404:
          description: Collectivity not found.

    post:
      summary: Create one or more activities for a collectivity
      description: |
        Creates activities linked to the given collectivity.
        - GENERAL_ASSEMBLY activities are automatically set as mandatory for ALL members.
        - JUNIOR_TRAINING activities are automatically set as mandatory for JUNIORS only.
        - EXCEPTIONAL activities can define their own mandatory flag and targetAudience.
        - The optional `planificationRule` field describes the recurrence pattern
          (e.g. "SECOND_SUNDAY_MONTHLY", "FOURTH_SATURDAY_MONTHLY").
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateActivity'
      responses:
        201:
          description: List of created activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
        400:
          description: Missing required field (type, title, or scheduledDate).
        404:
          description: Collectivity not found.

  # ── Feature F : Attendance ─────────────────────────────────────────────────

  '/activities/{id}/attendances':
    get:
      summary: Get attendance list for a specific activity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: List of attendance records for the activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        404:
          description: Activity not found.

    post:
      summary: Record member attendance for a specific activity (batch)
      description: |
        Records or updates attendance for one or more members for the given activity.
        If a record already exists for (activityId, memberId), it is updated (upsert).
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAttendance'
      responses:
        201:
          description: List of recorded attendance entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        404:
          description: Activity or member not found.

  '/members':
    post:
      summary: Create list of members
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMember'
      responses:
        201:
          description: List of created members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        400:
          description: Bad request (bad referees, missing payment, etc.)
        404:
          description: Collectivity or member not found.

  '/members/{id}/payments':
    post:
      summary: Create payments for a given member
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateMemberPayment'
      responses:
        201:
          description: List of created member payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberPayment'

  '/members/{id}/attendances':
    get:
      summary: Get attendance history for a specific member
      description: |
        Returns all attendance records for the given member across all activities,
        ordered by recordedAt descending.
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
      responses:
        200:
          description: Attendance history for the member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        404:
          description: Member not found.

  '/collectivites/statistics':
    get:
      summary: Get overall statistics for all collectivities
      parameters:
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: true
      responses:
        200:
          description: Overall statistics per collectivity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityOverallStatistics'

  '/collectivites/{id}/statistics':
    get:
      summary: Get local statistics for a specific collectivity
      parameters:
        - in: path
          name: id
          schema:
            type: string
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: true
      responses:
        200:
          description: Per-member payment statistics for the collectivity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectivityLocalStatistics'

components:
  schemas:

    # ── Feature E schemas ──────────────────────────────────────────────────

    CreateActivity:
      type: object
      required:
        - title
        - type
        - scheduledDate
      properties:
        title:
          type: string
          example: "Assemblée générale de mai"
        type:
          $ref: '#/components/schemas/ActivityType'
        scheduledDate:
          type: string
          format: date
          example: "2026-05-11"
        mandatory:
          type: boolean
          default: false
          description: Ignored for GENERAL_ASSEMBLY (always true/ALL) and JUNIOR_TRAINING (always true/JUNIORS).
        targetAudience:
          $ref: '#/components/schemas/TargetAudience'
        planificationRule:
          type: string
          description: Optional recurrence pattern, e.g. "SECOND_SUNDAY_MONTHLY".
          example: "SECOND_SUNDAY_MONTHLY"

    Activity:
      type: object
      properties:
        id:
          type: string
        collectivityId:
          type: string
          nullable: true
          description: Null for federation-level activities.
        title:
          type: string
        type:
          $ref: '#/components/schemas/ActivityType'
        scheduledDate:
          type: string
          format: date
        mandatory:
          type: boolean
        targetAudience:
          $ref: '#/components/schemas/TargetAudience'
        planificationRule:
          type: string
          nullable: true

    ActivityType:
      type: string
      enum:
        - GENERAL_ASSEMBLY
        - JUNIOR_TRAINING
        - EXCEPTIONAL
        - FEDERATION

    TargetAudience:
      type: string
      enum:
        - ALL
        - JUNIORS
        - CUSTOM

    # ── Feature F schemas ──────────────────────────────────────────────────

    CreateAttendance:
      type: object
      required:
        - memberId
        - status
      properties:
        memberId:
          type: string
        status:
          $ref: '#/components/schemas/AttendanceStatus'

    Attendance:
      type: object
      properties:
        id:
          type: string
        activityId:
          type: string
        member:
          $ref: '#/components/schemas/Member'
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        recordedAt:
          type: string
          format: date

    AttendanceStatus:
      type: string
      enum:
        - PRESENT
        - ABSENT
        - EXCUSED

    # ── Existing schemas (unchanged) ───────────────────────────────────────

    CreateCollectivity:
      type: object
      properties:
        location:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        federationApproval:
          type: boolean
        structure:
          $ref: '#/components/schemas/CreateCollectivityStructure'

    CreateCollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/MemberIdentifier'
        vicePresident:
          $ref: '#/components/schemas/MemberIdentifier'
        treasurer:
          $ref: '#/components/schemas/MemberIdentifier'
        secretary:
          $ref: '#/components/schemas/MemberIdentifier'

    CollectivityStructure:
      type: object
      properties:
        president:
          $ref: '#/components/schemas/Member'
        vicePresident:
          $ref: '#/components/schemas/Member'
        treasurer:
          $ref: '#/components/schemas/Member'
        secretary:
          $ref: '#/components/schemas/Member'

    CollectivityInformation:
      type: object
      properties:
        name:
          type: string
        number:
          type: integer

    Collectivity:
      type: object
      allOf:
        - $ref: '#/components/schemas/CollectivityInformation'
      properties:
        id:
          type: string
        location:
          type: string
        structure:
          $ref: '#/components/schemas/CollectivityStructure'
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    CollectivityLocalStatistics:
      type: object
      properties:
        memberDescription:
          $ref: '#/components/schemas/MemberDescription'
        earnedAmount:
          type: number
        unpaidAmount:
          type: number

    CollectivityOverallStatistics:
      type: object
      properties:
        collectivityInformation:
          $ref: '#/components/schemas/CollectivityInformation'
        newMembersNumber:
          type: integer
        overallMemberCurrentDuePercentage:
          type: number

    MemberIdentifier:
      type: string

    CreateMember:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        collectivityIdentifier:
          type: string
        referees:
          type: array
          items:
            $ref: '#/components/schemas/MemberIdentifier'
        registrationFeePaid:
          type: boolean
        membershipDuesPaid:
          type: boolean

    MemberDescription:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        occupation:
          type: string

    MemberInformation:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
        profession:
          type: string
        phoneNumber:
          type: integer
        email:
          type: string
        occupation:
          $ref: '#/components/schemas/MemberOccupation'

    Member:
      type: object
      allOf:
        - $ref: '#/components/schemas/MemberInformation'
      properties:
        id:
          $ref: '#/components/schemas/MemberIdentifier'
        referees:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    CreateMembershipFee:
      type: object
      properties:
        eligibleFrom:
          type: string
          format: date
        frequency:
          $ref: '#/components/schemas/Frequency'
        amount:
          type: number
        label:
          type: string

    MembershipFee:
      allOf:
        - $ref: '#/components/schemas/CreateMembershipFee'
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/ActivityStatus'

    CreateMemberPayment:
      type: object
      properties:
        amount:
          type: integer
        membershipFeeIdentifier:
          type: string
        accountCreditedIdentifier:
          type: string
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'

    MemberPayment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        accountCredited:
          $ref: '#/components/schemas/FinancialAccount'
        creationDate:
          type: string
          format: date

    FinancialAccount:
      oneOf:
        - $ref: '#/components/schemas/CashAccount'
        - $ref: '#/components/schemas/MobileBankingAccount'
        - $ref: '#/components/schemas/BankAccount'

    CashAccount:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer

    MobileBankingAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        mobileBankingService:
          $ref: '#/components/schemas/MobileBankingService'
        mobileNumber:
          type: integer
        amount:
          type: number

    BankAccount:
      type: object
      properties:
        id:
          type: string
        holderName:
          type: string
        bankName:
          $ref: '#/components/schemas/Bank'
        bankCode:
          type: integer
        bankBranchCode:
          type: integer
        bankAccountNumber:
          type: integer
        bankAccountKey:
          type: integer
        amount:
          type: number

    CollectivityTransaction:
      type: object
      properties:
        id:
          type: string
        creationDate:
          type: string
          format: date
        amount:
          type: number
        paymentMode:
          $ref: '#/components/schemas/PaymentMode'
        accountCredited:
          $ref: '#/components/schemas/FinancialAccount'
        memberDebited:
          $ref: '#/components/schemas/Member'

    MobileBankingService:
      type: string
      enum:
        - AIRTEL_MONEY
        - MVOLA
        - ORANGE_MONEY

    Bank:
      type: string
      enum:
        - BRED
        - MCB
        - BMOI
        - BOA
        - BGFI
        - AFG
        - ACCES_BAQUE
        - BAOBAB
        - SIPEM

    Gender:
      type: string
      enum:
        - MALE
        - FEMALE

    MemberOccupation:
      type: string
      enum:
        - JUNIOR
        - SENIOR
        - SECRETARY
        - TREASURER
        - VICE_PRESIDENT
        - PRESIDENT

    Frequency:
      type: string
      enum:
        - WEEKLY
        - MONTHLY
        - ANNUALLY
        - PUNCTUALLY

    ActivityStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    PaymentMode:
      type: string
      enum:
        - CASH
        - MOBILE_BANKING
        - BANK_TRANSFER